version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: metro_postgres
    environment:
      POSTGRES_USER: metro_user
      POSTGRES_PASSWORD: metro_password
      POSTGRES_DB: metro_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: