{% extends "insurance/base.html" %}
{% block content %}
<h1>Клиенты</h1>
<p><a href="{% url 'insurance:client-create' %}">Добавить</a></p>
<table border="1" cellpadding="6" class="js-filter-table">
  <thead><tr><th>ФИО</th><th>Телефон</th><th>Email</th><th></th></tr></thead>
  <tbody>
  {% for c in clients %}
  <tr>
    <td><a href="{% url 'insurance:client-detail' c.pk %}">{{ c.full_name }}</a></td>
    <td>{{ c.phone }}</td>
    <td>{{ c.email }}</td>
    <td>
      <a href="{% url 'insurance:client-update' c.pk %}">Изменить</a>
      <a href="{% url 'insurance:client-delete' c.pk %}">Удалить</a>
    </td>
  </tr>
  {% empty %}
  <tr><td colspan="4">Нет записей.</td></tr>
  {% endfor %}
  </tbody>
</table>
{% include "insurance/_pagination.html" %}
{% endblock %}
