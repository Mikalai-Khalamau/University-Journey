{% extends "insurance/base.html" %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<h1>Регистрация</h1>
{% if form.errors %}
  <p style="color:red;">Исправьте ошибки ниже.</p>
{% endif %}
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <p><button type="submit">Создать аккаунт</button></p>
</form>
<p>Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>
{% endblock %}
